
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite | Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #eff4fb;
            font-family: Arial, sans-serif;
            color: #172554;
        }
        .login-card {
            width: min(420px, 92%);
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 35px #17255418;
        }
        h1 { margin: 0 0 8px; }
        p { color: #64748b; }
        label { display: block; margin: 18px 0 7px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>HCM Lite</h1>
        <p>Sign in to your HR workspace</p>

        {% if form.errors %}
            <p class="error">Username or password is incorrect.</p>
        {% endif %}

        {% if next %}
            <p>Please log in to continue.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <label for="username">Username</label>
            <input id="username" type="text" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
